<!DOCTYPE html>
<html>
<head>
    <title>Sports Registration</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

<h2>Sports Registration Form</h2>

<form onsubmit="return validate()">

    <label>Full Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Email:</label>
    <input type="email" id="email">
    <br><br>

    <label>Age:</label>
    <input type="number" id="age">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    <label>Select Sport:</label>
    <select id="sport">
        <option value="">--Select Sport--</option>
        <option value="Football">Football</option>
        <option value="Cricket">Cricket</option>
        <option value="Basketball">Basketball</option>
        <option value="Badminton">Badminton</option>
    </select>
    <br><br>

    <label>Skills:</label>
    <input type="checkbox" name="skill" value="Running"> Running
    <input type="checkbox" name="skill" value="Fitness"> Fitness
    <input type="checkbox" name="skill" value="Teamwork"> Teamwork
    <br><br>

    <label>Why do you want to participate?</label><br>
    <textarea id="reason" rows="4" cols="30"></textarea>
    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>

<script src="js/script.js"></script>

</body>
</html>
